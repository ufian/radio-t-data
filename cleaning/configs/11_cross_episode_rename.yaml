version: 1
name: Cross-episode rename - unique names for different people with same name
priority: 11
description: Voice matching подтвердил что одноимённые гости в разных эпизодах — разные люди.
  Даём уникальные имена по области экспертизы.
rules:
# Alexander — 3 разных человека (voice match avg < 0.3 между эпизодами)
- id: cross_e27_Alexander_to_Alexander_Desktop
