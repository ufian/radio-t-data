version: 1
name: Jubilee episode splits - individual caller identification
priority: 13
description: |
  Юбилейные выпуски (ep100, 150, 202) содержат множество звонящих слушателей.
  Оригинальные данные имеют нумерацию Guest1-GuestN.
  Config 08 ранее сливал их в Guest_Unknown — теперь правила перенесены сюда
  с правильными именами на основе контекста эпизодов.
  Также переименовывает промежуточные имена из config 08 (Guest_Ruslan и т.п.)
  в финальные имена из classification_results.yaml.

rules:

# ============================================================
# Episode 100 - Юбилейный выпуск (окт 2008)
# Guest4→Olyapka (config 03), Guest6→Gimlis (config 08) — уже обработаны
# ============================================================

- id: jub_e100_Guest1_to_Caller_Denis_ep100
  type: rename_episode
  episode: 100
  from: Guest1
  to: Caller_Denis_ep100
  reason: "Денис (имя из Skype). Хосты называют 'Денис' (6191s, 6200s, 6236s). Слушает 1 месяц, первый звонок."

