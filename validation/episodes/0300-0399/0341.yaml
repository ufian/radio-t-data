        но в списке спикеров её нет. Её реплики размечены как Marin_k_a и SPEAKER_00.
        Марина (Marin_k_a) вообще НЕ упоминается в эпизоде.

    - speaker: "SPEAKER_MISATTRIBUTED_*"
