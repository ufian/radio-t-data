      issue: |
        Gray не представлен в начале, но появляется с одной репликой в 3004s.
        В начале (17-38s) Umputun опрашивает: "Саш, смотри, у тебя голос есть?" (кто это?),
        "Богу, как у тебя с голосом?" (Bobuk), "Маруся, у тебя как?" (Marin_k_a).
        "Саш" может быть обращением к кому-то другому или ошибкой распознавания.

    - speaker: "SPEAKER_03"
      issue: |
        131 реплика, 242 секунды - слишком много для ошибки распознавания.
        Перемежается с Marin_k_a, но отдельный спикер. Требует voice comparison.

    - speaker: "Multiple female voices"
      issue: |
        В выпуске несколько источников женских голосов: Marin_k_a, SPEAKER_03,
        SPEAKER_06, SPEAKER_MISATTRIBUTED_LAVALE. Возможно это 1-2 человека
        с ошибками распознавания, или действительно несколько женщин.

