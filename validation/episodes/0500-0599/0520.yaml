# Проверка консистентности
consistency_check:
  all_speakers_introduced: false
  issues:
    - speaker: "Gray"
      issue: |
        В начале эпизода Umputun явно говорит, что Gray отсутствует:
        "Состав обычный для гиковских выпусков, когда Грей не находит в себе
        силы и смелости прийти в наше с вами, Булбоке и Ксюше, славное общество."

        Однако у Gray есть 1 реплика в 6658s: "Нет, Ксюш, ну ты что?"

        Возможные объяснения:
        1. Gray подключился позже (но не был представлен)
        2. Ошибка атрибуции - реплика принадлежит другому ведущему

        Реплика короткая (1 сек), обращена к Ksenks. Требует voice comparison.

    - speaker: "Alek.sys"
      issue: |
        Alek.sys имеет 9 реплик в эпизоде, но НЕ упомянут в представлении.
        Umputun говорит только о "Булбоке и Ксюше".

        Реплики Alek.sys разбросаны по всему эпизоду (1197s - 6882s),
        все короткие (0.5 - 2 сек). Возможно это ошибочная атрибуция,
        и эти реплики принадлежат другим ведущим.

